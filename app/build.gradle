plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bnotion.uniuyotowncampus'
    compileSdk 34

    packagingOptions {
        resources {
            excludes += ['META-INF/LGPL2.1', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }

    defaultConfig {
        applicationId "com.bnotion.uniuyotowncampus"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // Exclude the v8 annotation plugin to avoid namespace conflict with v9
    exclude group: 'com.mapbox.mapboxsdk', module: 'mapbox-android-plugin-annotation-v8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'

    // Mapbox Maps SDK (v9 - legacy but available on Maven Central)
    implementation 'com.mapbox.mapboxsdk:mapbox-android-sdk:9.2.1'

    // Mapbox Navigation SDK (legacy but available on Maven Central)
    implementation 'com.mapbox.mapboxsdk:mapbox-android-navigation:0.42.6'
    implementation 'com.mapbox.mapboxsdk:mapbox-android-navigation-ui:0.42.6'

    // Mapbox Plugins (v9 versions for Maps SDK 9.x)
    implementation 'com.mapbox.mapboxsdk:mapbox-android-plugin-markerview-v9:0.4.0'
    implementation 'com.mapbox.mapboxsdk:mapbox-android-plugin-annotation-v9:0.9.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
